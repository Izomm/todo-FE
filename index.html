<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"

        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <script src="/static/script/index.js"></script>

<body>
    <header>
        <nav class="flex justify-between mx-6 my-2 mt-4">
            <ul class="flex items-center">
                <img class="w-4" src="/static/images/icons/1hero.png" />
                <a href="" class="ms-2 text-[#5f02f6] font-bold">Todo AI</a>

            </ul>
            <ul class="flex justify-between ">
                <a class="flex items-center mx-6">
                    <img class="w-4" src="/static/images/icons/world-wide-web.png" alt="">
                    <p>Discovery</p>

                </a>

                <a class="flex items-center mx-6">
                    <img class="w-4" src="/static/images/icons/clipboard.png" alt="">
                    <p>My Tasks</p>
                </a>

                <a class="flex items-center mx-6">
                    <img class="w-4" src="/static/images/icons/exit.png" alt="">

                </a>

        </nav>
        <div class="hl border border-gray-100 mt-4 "> </div>

    <main class="mx-6 mt-12">
        <div class="discovery-feed mx-6 my-6">
            <div class="flex items-center mb-2">
                <img class="w-4" src="/static/images/icons/world-wide-web.png" alt="">

            </div>
            <p>See what others are accomplishing and find inspiration for your own day. <br> Add any task that resonates
                with
                you to your personal list.</p>

        </div>

        <div class=" feed flex flex-col justify-center items-center mt-48">
            <div class="bg-gray-100 rounded-full p-8 mb-10">
                <img class="w-16 opacity-25 " src="/static/images/icons/world-wide-web.png" alt="">
            </div>
            <div class="flex flex-col justify-center items-center">
                <h3 class=" ms-2 text-4xl font-bold mb-2">Feed is Empty</h3>
                <p class="text-xl opacity-25">Be the First to Share a Task witht the world</p>
            </div>

        </div>
